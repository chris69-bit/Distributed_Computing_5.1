# Generated by: python -m telerm.deploy compose   (edit config.json, then regenerate)
# TeleRM S3: every microservice and every site in its own container.
# Sites get CPU quotas (cpus:) so each behaves like a separate, smaller machine.
name: telerm

x-telerm: &telerm
  image: telerm:s3
  build:
    context: .
    args:
      BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
  volumes:
    - ./results:/app/results
  init: true

services:
  registry:
    <<: *telerm
    hostname: registry
    command: ["python", "-m", "telerm.registry", "--port", "8010", "--bind", "0.0.0.0", "--hb-timeout", "3.0"]
    cpus: 0.2
    mem_limit: 256m

  telemetry:
    <<: *telerm
    hostname: telemetry
    command: ["python", "-m", "telerm.telemetry", "--port", "8020", "--bind", "0.0.0.0", "--host", "telemetry", "--registry", "registry:8010", "--location", "cloud-1", "--out", "/app/results/${RUN:-run}"]
    cpus: 0.2
    mem_limit: 256m
    depends_on: [registry]

  orchestrator:
    <<: *telerm
    hostname: orchestrator
    command: ["python", "-m", "telerm.manager", "--port", "8000", "--bind", "0.0.0.0", "--host", "orchestrator", "--registry", "registry:8010", "--location", "core-1", "--topology", "/app/config.json", "--policy", "${POLICY:-tier_aware}", "--out", "/app/results/${RUN:-run}"]
    cpus: 0.2
    mem_limit: 256m
    depends_on: [registry]

  gw-a:
    <<: *telerm
    hostname: gw-a
    command: ["python", "-m", "telerm.gateway", "--name", "gw-A", "--location", "edge-A", "--port", "8201", "--bind", "0.0.0.0", "--host", "gw-a", "--registry", "registry:8010", "--delay-mode", "emulate"]
    cpus: 0.25
    mem_limit: 256m
    depends_on: [registry]

  gw-b:
    <<: *telerm
    hostname: gw-b
    command: ["python", "-m", "telerm.gateway", "--name", "gw-B", "--location", "edge-B", "--port", "8202", "--bind", "0.0.0.0", "--host", "gw-b", "--registry", "registry:8010", "--delay-mode", "emulate"]
    cpus: 0.25
    mem_limit: 256m
    depends_on: [registry]

  edge-a:
    <<: *telerm
    hostname: edge-a
    command: ["python", "-m", "telerm.site", "--id", "edge-A", "--tier", "edge", "--port", "8101", "--bind", "0.0.0.0", "--host", "edge-a", "--registry", "registry:8010", "--cpu", "4000", "--mem", "4096", "--bw", "2000", "--slots", "2", "--work-kb", "8192"]
    cpus: 0.25
    mem_limit: 512m
    depends_on: [registry]

  edge-b:
    <<: *telerm
    hostname: edge-b
    command: ["python", "-m", "telerm.site", "--id", "edge-B", "--tier", "edge", "--port", "8102", "--bind", "0.0.0.0", "--host", "edge-b", "--registry", "registry:8010", "--cpu", "4000", "--mem", "4096", "--bw", "2000", "--slots", "2", "--work-kb", "8192"]
    cpus: 0.25
    mem_limit: 512m
    depends_on: [registry]

  core-1:
    <<: *telerm
    hostname: core-1
    command: ["python", "-m", "telerm.site", "--id", "core-1", "--tier", "core", "--port", "8103", "--bind", "0.0.0.0", "--host", "core-1", "--registry", "registry:8010", "--cpu", "12000", "--mem", "16384", "--bw", "10000", "--slots", "4", "--work-kb", "8192"]
    cpus: 0.5
    mem_limit: 512m
    depends_on: [registry]

  cloud-1:
    <<: *telerm
    hostname: cloud-1
    command: ["python", "-m", "telerm.site", "--id", "cloud-1", "--tier", "cloud", "--port", "8104", "--bind", "0.0.0.0", "--host", "cloud-1", "--registry", "registry:8010", "--cpu", "24000", "--mem", "32768", "--bw", "40000", "--slots", "4", "--work-kb", "8192"]
    cpus: 0.75
    mem_limit: 512m
    depends_on: [registry]

  loadgen:
    <<: *telerm
    profiles: [tools]
    command: ["python", "m3_run.py", "--help"]
    cpus: 0.5
    depends_on: [registry]
